# top-panel-engraving.yaml — Engraving for Hammond 1590DD top panel
#
# Panel: 181.8 × 113.8 mm LANDSCAPE (long axis = X left-right, short axis = Y)
# Origin: front-left corner of case top surface (plates default, origin=corner)
#
# ORIENTATION: Y=0 = FRONT of case (player side, button row 2 side)
#              Y=113.8 = BACK of case (encoder/connector side)
#
# Physical layout front-to-back (Y axis):
#   Y=0          front edge
#   Y=13.4       buttons row 2: B (X=15.9), D (X=90.9), F (X=165.9)
#   Y=36.2       displays:  D1 (X=53.4), D2 (X=128.4)
#   Y=65.4       buttons row 1: A (X=15.9), C (X=90.9), E (X=165.9)
#   Y=84.4       LEDs:      Mode (X=78.4), Mon (X=103.4)
#   Y=98.4       encoders:  Vol (X=53.9), Gain (X=128.9)
#   Y=113.8      back edge  (USB, MIDI, PWR)
#
# Connector positions (from drilling template):
#   Left edge  (X=0)    — outputs: Exp 2 (Y=21.9), Out 1 (Y=62.9), Out 2 (Y=83.1)
#   Right edge (X=181.8)— inputs:  In 2 (Y=30.7),  In 1 (Y=50.9),  Exp 1 (Y=91.9)
#   Back edge  (Y=113.8)— rear:    USB (X=37.0), MIDI Out (X=75.9), MIDI In (X=105.9), PWR (X=145.9)

plate:
  width: 181.8
  height: 113.8
  material: alu

tool:
  vbit_angle: 60
  vbit_depth_max: 0.3
  end_mill_dia: 3.0
  depth_per_pass: 0.1
  safe_z: 5.0
  retract_z: 1.0
  spindle_rpm: 10000

feeds:
  xy: 150
  z: 50

features:

  # ── BUTTON LABELS ─────────────────────────────────────────────────────────
  # Physical layout (landscape, Y=0=front, Y=113.8=back):
  #   D/E/F back row  at Y=65.4  (kicad_y=72,  closer to encoders)
  #   A/B/C front row at Y=13.4  (kicad_y=124, closer to player)
  #
  # D/E/F labels above back row (toward encoders): Y = 65.4 + 12.0 + 2.5 = 79.9
  # A/B/C labels above front row (toward back):   Y = 13.4 + 12.0 + 2.5 = 27.9

  - type: text
    text: "D"
    x: 22.0
    y: 50.9
    align: center
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 4.0
    strategy: vcarve

  - type: text
    text: "E"
    x: 90.9
    y: 50.9
    align: center
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 4.0
    strategy: vcarve

  - type: text
    text: "F"
    x: 159.8
    y: 50.9
    align: center
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 4.0
    strategy: vcarve

  - type: text
    text: "A"
    x: 22.0
    y: 27.9
    align: center
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 4.0
    strategy: vcarve

  - type: text
    text: "B"
    x: 90.9
    y: 27.9
    align: center
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 4.0
    strategy: vcarve

  - type: text
    text: "C"
    x: 159.8
    y: 27.9
    align: center
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 4.0
    strategy: vcarve

  # ── LED LABELS (light pipes) ──────────────────────────────────────────────
  # LEDs at Y=84.4. Place labels BESIDE (facing inward between the two holes):
  #   Mode right of its hole: X = 78.4 + 3.0 + 2.0 = 83.4, left-aligned
  #   Mon  left  of its hole: X = 103.4 - 3.0 - 2.0 = 98.4, right-aligned

  - type: text
    text: "Mode"
    x: 73.4
    y: 84.4
    align: left
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 2.5
    strategy: vcarve

  - type: text
    text: "Mon"
    x: 108.4
    y: 84.4
    align: right
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 2.5
    strategy: vcarve

  # ── ENCODER LABELS ────────────────────────────────────────────────────────
  # Encoders at Y=98.4 (near back). LEDs at Y=84.4 just in front.
  # Place labels BESIDE encoders in X:
  #   Vol  left  of encoder: X = 53.9 - 12.0 - 0.5 = 41.4, right-aligned
  #   Gain right of encoder: X = 128.9 + 12.0 + 0.5 = 141.4, left-aligned

  - type: text
    text: "Vol"
    x: 41.4
    y: 98.4
    align: right
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 3.5
    strategy: vcarve

  - type: text
    text: "Gain"
    x: 141.4
    y: 98.4
    align: left
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 3.5
    strategy: vcarve

  # ── LEFT EDGE — OUTPUTS (X=0) ─────────────────────────────────────────────
  # Boxes paired with right edge at same Y for visual alignment.
  # Shared Y rows: Exp row=87.5, Out1/In1 row=56.9, Out2/In2 row=26.3

  - type: rounded_rect
    x: 1.0
    y: 89.15
    width: 12.0
    height: 5.5
    sharp_corner: bottom-left
    corner_radius: 2.5

  - type: text
    text: "Exp 2"
    x: 7.0
    y: 91.9
    align: center
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 2.2
    strategy: vcarve

  - type: rounded_rect
    x: 1.0
    y: 48.15
    width: 12.0
    height: 5.5
    sharp_corner: bottom-left
    corner_radius: 2.5

  - type: text
    text: "Out 1"
    x: 7.0
    y: 50.9
    align: center
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 2.2
    strategy: vcarve

  - type: rounded_rect
    x: 1.0
    y: 27.95
    width: 12.0
    height: 5.5
    sharp_corner: bottom-left
    corner_radius: 2.5

  - type: text
    text: "Out 2"
    x: 7.0
    y: 30.7
    align: center
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 2.2
    strategy: vcarve

  # ── RIGHT EDGE — INPUTS (X=181.8) ─────────────────────────────────────────
  # Same Y rows as left edge.

  - type: rounded_rect
    x: 168.8
    y: 89.15
    width: 12.0
    height: 5.5
    sharp_corner: bottom-right
    corner_radius: 2.5

  - type: text
    text: "Exp 1"
    x: 174.8
    y: 91.9
    align: center
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 2.2
    strategy: vcarve

  - type: rounded_rect
    x: 168.8
    y: 48.15
    width: 12.0
    height: 5.5
    sharp_corner: bottom-right
    corner_radius: 2.5

  - type: text
    text: "In 1"
    x: 174.8
    y: 50.9
    align: center
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 2.2
    strategy: vcarve

  - type: rounded_rect
    x: 168.8
    y: 27.95
    width: 12.0
    height: 5.5
    sharp_corner: bottom-right
    corner_radius: 2.5

  - type: text
    text: "In 2"
    x: 174.8
    y: 30.7
    align: center
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 2.2
    strategy: vcarve

  # ── BACK EDGE — REAR CONNECTORS (Y=113.8) ─────────────────────────────────
  # sharp_corner=top-left → top face points to Y=113.8
  # USB and PWR omitted — self-explanatory

  - type: rounded_rect
    x: 75.9
    y: 107.3
    width: 14.0
    height: 5.5
    sharp_corner: top-left
    corner_radius: 2.5

  - type: text
    text: "MIDI Out"
    x: 82.9
    y: 110.05
    align: center
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 2.2
    strategy: vcarve

  - type: rounded_rect
    x: 91.9
    y: 107.3
    width: 14.0
    height: 5.5
    sharp_corner: top-right
    corner_radius: 2.5

  - type: text
    text: "MIDI In"
    x: 98.9
    y: 110.05
    align: center
    font: /usr/share/fonts/TTF/RobotoCondensed-Bold.ttf
    size: 2.2
    strategy: vcarve


